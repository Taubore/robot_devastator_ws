# Lancement de diagnostic : surveillance de l'alimentation seule.
# Jamais utilisé en exploitation normale — réservé à la mise au point du
# sous-système INA260 avant son intégration dans devastator.launch.yaml.
launch:
- node:
    pkg: surveillance_alimentation
    exec: surveillance_alimentation
    name: surveillance_alimentation
    output: screen
    param:
    - from: $(find-pkg-share robot_devastator_bringup)/config/surveillance_alimentation.yaml
