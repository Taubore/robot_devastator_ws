launch:
- node:
    pkg: surveillance_alimentation
    exec: surveillance_alimentation
    name: surveillance_alimentation
    output: screen
    param:
    - from: $(find-pkg-share robot_devastator_bringup)/config/surveillance_alimentation.yaml
- node:
    pkg: interface_pico
    exec: interface_pico
    name: interface_pico
    output: screen
    param:
    - from: $(find-pkg-share robot_devastator_bringup)/config/interface_pico.yaml
- node:
    pkg: odometrie
    exec: odometrie
    name: odometrie
    output: screen
    param:
    - from: $(find-pkg-share robot_devastator_bringup)/config/mecanique.yaml
- node:
    pkg: robot_devastator
    exec: arbitre_commande_moteurs
    name: arbitre_commande_moteurs
    output: screen
    param:
    - from: $(find-pkg-share robot_devastator_bringup)/config/arbitre_commande_moteurs.yaml
- node:
    pkg: affichage_lcd
    exec: affichage_lcd
    name: affichage_lcd
    output: screen
    param:
    - from: $(find-pkg-share robot_devastator_bringup)/config/affichage_lcd.yaml
- node:
    pkg: robot_devastator
    exec: annonces_audio
    name: annonces_audio
    output: screen
    param:
    - from: $(find-pkg-share robot_devastator_bringup)/config/annonces_audio.yaml
- node:
    pkg: robot_devastator
    exec: evitement_obstacle
    name: evitement_obstacle
    output: screen
    param:
    - from: $(find-pkg-share robot_devastator_bringup)/config/autonomie_simple.yaml
- include:
    # rplidar_composition et gestion_lidar, avec arrêt de fermeture ordonné (gestion_lidar met
    # le RPLIDAR en dormance avant que rplidar_composition ne reçoive son SIGINT). Isolé en
    # .launch.py : YAML ne permet pas d'accrocher une action au Shutdown global. Voir
    # docs/decisions_et_lecons.md.
    file: $(find-pkg-share robot_devastator_bringup)/launch/rplidar_gestion_lidar.launch.py
- include:
    file: $(find-pkg-share robot_devastator_bringup)/launch/robot_state_publisher.launch.py
